# 利润表合计公式

totals:
  # 二、营业利润 = 营业收入 - 营业成本 - 税金及附加 - 销售费用 - 管理费用 - 财务费用 + 投资收益
  21: {add: [1, 20], sub: [2, 3, 11, 14, 18]}
  # 三、利润总额 = 营业利润 + 营业外收入 - 营业外支出
  30: {add: [21, 22], sub: [24]}
  # 四、净利润 = 利润总额 - 所得税费用
  32: {add: [30], sub: [31]}

# 「其中」明细行：金额已含在父行内，不重复参与合计
sub_lines: [4, 5, 6, 7, 8, 9, 10, 12, 13, 15, 16, 17, 19, 23, 25, 26, 27, 28, 29]

# 净利润行次
net_profit_line: 32
