# 现金流量表合计公式
#
# 科目 → 现金流活动的归类不在这里，而在 accounts.yaml 的 cf_in / cf_out 字段，
# 与科目定义放在一起便于维护。

totals:
  7:  {add: [1, 2], sub: [3, 4, 5, 6]}        # 经营活动产生的现金流量净额
  13: {add: [8, 9, 10], sub: [11, 12]}        # 投资活动产生的现金流量净额
  19: {add: [14, 15], sub: [16, 17, 18]}      # 筹资活动产生的现金流量净额
  20: {add: [7, 13, 19]}                      # 四、现金净增加额
  22: {add: [21, 20]}                         # 五、期末现金余额 = 期初 + 净增加

# 流入行（借银行存款时归到这些行）
inflow_lines: [1, 2, 8, 9, 10, 14, 15]
# 流出行（贷银行存款时归到这些行，表内以正数列示）
outflow_lines: [3, 4, 5, 6, 11, 12, 16, 17, 18]

net_increase_line: 20
opening_cash_line: 21
closing_cash_line: 22
